# Desktop customization config (sourced by setup-desktop.sh, parsed by wallpaper.py)
# Re-run `./desktop/setup-desktop.sh` after changing anything here.
# Run a single section with e.g. `./desktop/setup-desktop.sh wallpaper dock`.

# ---------- Theme (Colloid GTK + Shell theme with Catppuccin palette) ----------
ENABLE_THEME=true
COLOR_SCHEME="prefer-dark"            # prefer-dark | default
COLLOID_COLOR="purple"                # default|purple|pink|red|orange|yellow|green|teal|grey
COLLOID_SIZE="standard"               # standard | compact
COLLOID_TWEAKS="catppuccin rimless"   # nord|dracula|gruvbox|everforest|catppuccin + black|rimless|normal|float
COLLOID_LIBADWAITA=true               # also theme GTK4/libadwaita apps (Files, Settings...)

# ---------- Icons ----------
ENABLE_ICONS=true
ICON_THEME="Papirus-Dark"
PAPIRUS_FOLDER_COLOR="cat-mocha-mauve"   # any catppuccin/papirus-folders color, e.g. cat-mocha-blue

# ---------- Cursor ----------
ENABLE_CURSOR=true
CURSOR_THEME="Bibata-Modern-Classic"     # Bibata-Modern-Classic | Bibata-Modern-Ice | Bibata-Modern-Amber ...
CURSOR_SIZE=24

# ---------- Fonts ----------
ENABLE_FONTS=true
NERD_FONT="JetBrainsMono"                # archive name from ryanoasis/nerd-fonts releases
INTERFACE_FONT="Inter 11"
DOCUMENT_FONT="Inter 11"
MONOSPACE_FONT="JetBrainsMono Nerd Font 11"

# ---------- GNOME Shell extensions ----------
# Settings for each extension live in desktop/dconf/<name>.ini
# Tweak them in Extension Manager, then `./desktop/setup-desktop.sh --save-dconf` to store them here.
ENABLE_EXTENSIONS=true
EXTENSIONS=(
    "user-theme@gnome-shell-extensions.gcampax.github.com"
    "blur-my-shell@aunetx"
    "just-perfection-desktop@just-perfection"
    "Vitals@CoreCoding.com"
    "space-bar@luchrioh"
    "rounded-window-corners@fxgn"
    "burn-my-windows@schneegans.github.com"
)
# Window open/close animations, picked randomly among these. Names: glide, focus, portal, aura-glow,
# apparition, broken-glass, energize-a, energize-b, fire, glitch, hexagon, incinerate, matrix, pixelate, tv, wisps ...
BURN_MY_WINDOWS_EFFECTS="glide focus"

# ---------- Dock (Ubuntu Dock) ----------
ENABLE_DOCK=true
DOCK_POSITION="LEFT"                  # LEFT | BOTTOM | RIGHT
DOCK_AUTOHIDE=true                    # hidden until the pointer touches the screen edge
DOCK_ICON_SIZE=44
DOCK_EXTEND_HEIGHT=true

# ---------- Terminal (GNOME Terminal profile) ----------
ENABLE_TERMINAL=true
TERMINAL_PROFILE_NAME="Catppuccin Mocha"
TERMINAL_FONT="JetBrainsMono Nerd Font 12"
TERMINAL_FASTFETCH=true               # run fastfetch when an interactive bash shell starts (skipped in VS Code)

# ---------- Wallpaper ----------
ENABLE_WALLPAPER=true
WALLPAPER_DIR="$HOME/Pictures/Wallpapers"   # landscape/ and portrait/ subfolders; drop your own images there too
WALLPAPER_INTERVAL="6h"                     # systemd time span: 30min, 2h, 6h, 1d ...
WALLPAPER_PER_MONITOR=true                  # pick a separate image per monitor matching its orientation
WALLPAPER_ONLINE=true                       # download new images from Wallhaven
WALLPAPER_TOPICS="landscape,mountains,forest,lake,sea,outer space,galaxy,nebula,planet,cityscape night,city lights,minimalism,abstract,digital art"
WALLPAPER_EXCLUDE="mech,anime,weapon,car,women,men"   # wallhaven tags to leave out (single words)
WALLPAPER_CACHE_MAX=150                     # downloaded images kept per orientation (your own files are never deleted)
WALLPAPER_HISTORY=30                        # don't repeat the last N images
WALLHAVEN_CATEGORIES="100"                  # general/anime/people bits, e.g. 110 = general+anime
WALLHAVEN_PURITY="100"                      # 100 = SFW only
WALLHAVEN_SORTING="toplist"                 # toplist | favorites | views | random | date_added
WALLHAVEN_TOP_RANGE="1y"                    # used with toplist: 1d 3d 1w 1M 3M 6M 1y
WALLHAVEN_API_KEY=""                        # optional

# ---------- Keybindings ----------
ENABLE_KEYBINDINGS=true
KEY_WALLPAPER_NEXT="<Super><Alt>w"
KEY_WALLPAPER_BAN="<Super><Alt>x"
